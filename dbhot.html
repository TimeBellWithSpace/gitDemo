<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包含三个标题的示例页面</title>
    <!-- 简单的样式，让标题层级更直观 -->
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        h2 {
            color: #34495e;
            margin-top: 20px;
        }
        h3 {
            color: #7f8c8d;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- 一级标题：页面核心主题，一个页面通常只有1个h1 -->
    <h1>我的个人博客</h1>
    
    <!-- 二级标题：主要分类/章节 -->
    <h2>前端开发学习笔记</h2>
    
    <!-- 三级标题：分类下的具体小节 -->
    <h3>HTML 标题标签的使用规范</h3>

    <h3>v1后面的修改</h3>

    <h3>v3后面的修改(rollback)（修复bug）</h3>

    <h3>新功能开发100%</h3>

</body>
</html>
